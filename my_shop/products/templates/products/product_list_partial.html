{% load static %}

{% for product in products %}
<div class="col-md-4 mb-4">
    <div class="card product-card">
        <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
        <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.price }} бел.руб.</p>
            <form action="{% url 'add_to_basket' product.id %}" method="post" class="add-to-basket-form">
                {% csrf_token %}
                <input type="hidden" name="quantity" value="1">
                {% if user.is_authenticated %}
                <form action="{% url 'add_to_basket' product_id=product.pk %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cart-plus"></i> В корзину
                    </button>
                </form>
                {% else %}
                <a href="{% url 'login' %}?next={{ request.path }}" class="btn btn-primary">
                    <i class="bi bi-cart-plus"></i> В корзину
                </a>
                <small class="text-muted d-block mt-1">Требуется авторизация</small>
                {% endif %}
            </form>
            <a href="{% url 'product_detail' pk=product.pk %}" class="btn btn-primary">Подробнее</a>
        </div>
    </div>
</div>
{% endfor %}
