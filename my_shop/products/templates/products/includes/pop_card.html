{% load static %}

<div class="col-md-3 mb-4">
    <div class="card h-100">
        <a href="{% url 'product_detail' pk=product.pk %}">
            <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
        </a>
        <div class="card-body">
            <h5 class="card-title">
                <a href="{% url 'product_detail' pk=product.pk %}" class="text-decoration-none text-dark">
                    {{ product.name|truncatechars:30 }}
                </a>
            </h5>
            <p class="card-text text-muted">{{ product.get_main_category_name }}</p>
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold">{{ product.get_price_display }}</span>
                {% if user.is_authenticated %}
                <form action="{% url 'add_to_basket' product_id=product.pk %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cart-plus"></i> В корзину
                    </button>
                </form>
                {% else %}
                <a href="{% url 'login' %}?next={{ request.path }}" class="btn btn-primary">
                    <i class="bi bi-cart-plus"></i> В корзину
                </a>
                <small class="text-muted d-block mt-1">Требуется авторизация</small>
                {% endif %}
            </div>
        </div>
    </div>
</div>
