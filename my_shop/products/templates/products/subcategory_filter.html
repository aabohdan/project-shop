{% load static %}

<div class="sidebar-filter">
    <div class="filter-section">
        <h4 class="filter-title">Подкатегория</h4>
        <div class="filter-options">
            {% for subcat in subcategories %}
            <div class="filter-option">
                <input type="checkbox" 
                       id="subcat-{{ subcat.pk }}" 
                       name="subcategory" 
                       value="{{ subcat.pk }}"
                       {% if subcat.pk|stringformat:"s" in selected_subcategories %}checked{% endif %}>
                <label for="subcat-{{ subcat.pk }}">{{ subcat.name }} ({{ subcat.product_count }})</label>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="filter-section">
        <h4 class="filter-title">Рост</h4>
        <div class="filter-options">
            {% for size in sizes %}
            <div class="filter-option">
                <input type="checkbox" 
                       id="size-{{ size.pk }}" 
                       name="size" 
                       value="{{ size.pk }}"
                       {% if size.pk|stringformat:"s" in selected_sizes %}checked{% endif %}>
                <label for="size-{{ size.pk }}">{{ size.name }} ({{ size.product_count }})</label>
            </div>
            {% endfor %}
        </div>
    </div>
